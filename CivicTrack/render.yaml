services:
  - type: web
    name: civictrack-public-demo
    runtime: static
    rootDir: CivicTrack
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://civictrack-api-d6vm.onrender.com

  - type: web
    name: civictrack-api
    runtime: docker
    rootDir: CivicTrack
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/civictrack.db
      - key: UPLOAD_DIR
        value: /tmp/civictrack-uploads
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "false"
      - key: CORS_ORIGINS
        value: https://civictrack-public-demo-d6vm.onrender.com,http://localhost:3000,http://127.0.0.1:3000
